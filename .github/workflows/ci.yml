name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Moteur Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "engine[dev]"
      - run: python -m pytest -q
        working-directory: engine

  r-validation:
    name: Validation des statistiques contre R
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer R (paquets de base et pwr)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q r-base-core r-cran-pwr
          Rscript -e 'cat(R.version.string, "\n")'
      - run: pip install -e "engine[dev]"
      - name: Recalculer les valeurs de référence avec R
        working-directory: engine
        run: Rscript tests/reference/r_reference.R tests/reference/data "$RUNNER_TEMP/r_results.csv"
      - name: Comparer le moteur aux valeurs de R recalculées
        working-directory: engine
        env:
          STATPFE_R_RESULTS: ${{ runner.temp }}/r_results.csv
        run: python -m pytest -q tests/test_reference_r.py
      - name: Recalculer les valeurs de puissance avec R (pwr, power.t.test)
        working-directory: engine
        run: Rscript tests/reference/r_power.R "$RUNNER_TEMP/r_power.csv"
      - name: Comparer les calculs de puissance aux valeurs de R
        working-directory: engine
        env:
          STATPFE_R_POWER: ${{ runner.temp }}/r_power.csv
        run: python -m pytest -q tests/test_power_r.py

  latex:
    name: Export LaTeX compilé avec pdflatex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer TeX Live (comme Overleaf)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-lang-french texlive-fonts-recommended
      - run: pip install -e "engine[dev]"
      - name: Le rapport .zip pour Overleaf compile sans erreur
        working-directory: engine
        run: |
          pdflatex --version | head -1
          python -m pytest -q -rs tests/test_exports.py

  local-ai:
    name: IA locale avec un vrai modèle (Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "engine[dev]"
      - name: Installer Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Selon le runner, le service n'est pas démarré (pas de systemd) : le test suivant le
          # démarre alors par le bouton « Démarrer Ollama » de STATPFE.
      - name: Télécharger le modèle par l'assistant de STATPFE (qwen2.5:0.5b)
        working-directory: engine
        env:
          STATPFE_AI_LIVE_URL: http://127.0.0.1:11434
          STATPFE_SETUP_LIVE_PULL: qwen2.5:0.5b
        run: |
          python -m pytest -q -rs -s tests/test_ai_setup_live.py -k ollama
          ollama list
      - name: Parcours complet avec le modèle (protocoles Ollama et OpenAI)
        working-directory: engine
        env:
          STATPFE_AI_LIVE_URL: http://127.0.0.1:11434
          STATPFE_AI_LIVE_MODEL: qwen2.5:0.5b
          STATPFE_AI_LIVE_OUT: ${{ runner.temp }}/textes-ia.jsonl
        run: |
          python -m pytest -q -rs tests/test_ai_live.py tests/test_copilot_live.py
          cat "$RUNNER_TEMP/textes-ia.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: textes-produits-par-le-modele
          path: ${{ runner.temp }}/textes-ia.jsonl

  claude-code-install:
    name: Installation de Claude Code par l'assistant (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "engine[dev]"
      - name: Installation réelle par la commande officielle, puis détection
        working-directory: engine
        env:
          STATPFE_SETUP_LIVE_CLAUDE: "1"
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -rs -s tests/test_ai_setup_live.py -k claude

  frontend:
    name: Interface React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  windows-installer:
    name: Installateur Windows
    needs: [engine, r-validation, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Construire le moteur autonome (PyInstaller)
        working-directory: engine
        run: |
          pip install pyinstaller
          pip install -e .
          python packaging/build_sidecar.py

      - name: Vérifier le moteur autonome
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/src-tauri/binaries/statpfe-engine-*.exe | Select-Object -First 1
          $out = '{"jsonrpc":"2.0","id":1,"method":"engine.info"}' | & $exe.FullName
          Write-Output $out
          if (-not ($out -match '"name": "statpfe-engine"')) { throw "Le moteur autonome ne répond pas" }
          # IA locale : désactivée par défaut, ressources de la machine lues (mémoire Windows).
          $out = '{"jsonrpc":"2.0","id":9,"method":"ai.status"}' | & $exe.FullName
          Write-Output $out
          if (-not ($out -match '"state": "desactivee"') -or ($out -match '"memory_total": null')) { throw "Le module IA du moteur autonome est défaillant" }
          # Lecture réelle d'un CSV (pandas embarqué) par le moteur autonome.
          $csv = Join-Path $env:RUNNER_TEMP 'essai.csv'
          [IO.File]::WriteAllText($csv, "groupe;note`nA;12,5`nB;9`n", [Text.Encoding]::GetEncoding(1252))
          $req = @{ jsonrpc = '2.0'; id = 2; method = 'data.inspect_file'; params = @{ path = $csv } } | ConvertTo-Json -Compress
          $out = $req | & $exe.FullName
          Write-Output $out
          if (-not ($out -match '"rows": 2')) { throw "Le moteur autonome ne lit pas les fichiers CSV" }
          # Analyse statistique réelle (scipy embarqué) : projet, import, test de Welch.
          [IO.File]::WriteAllText($csv, "g;note`nA;12,5`nA;13`nA;11,5`nB;9`nB;10`nB;8,5`n", [Text.Encoding]::GetEncoding(1252))
          $proj = Join-Path $env:RUNNER_TEMP 'essai.statpfe'
          $lines = @(
            (@{ jsonrpc = '2.0'; id = 3; method = 'project.create'; params = @{ path = $proj; study = @{ title = 'Essai' } } } | ConvertTo-Json -Compress -Depth 5),
            (@{ jsonrpc = '2.0'; id = 4; method = 'data.import'; params = @{ path = $csv; name = 'E' } } | ConvertTo-Json -Compress -Depth 5),
            (@{ jsonrpc = '2.0'; id = 5; method = 'analysis.run'; params = @{ dataset_id = 1; method = 'welch'; params = @{ outcome = 'note'; group = 'g' } } } | ConvertTo-Json -Compress -Depth 5)
          )
          $out = ($lines -join "`n") | & $exe.FullName
          Write-Output $out
          if (-not ($out -match '"key": "t", "label": "t", "value": 5\.07796')) { throw "Le moteur autonome ne calcule pas le test de Welch" }
          # Rapports réels (python-docx, reportlab, matplotlib embarqués) : Word et PDF.
          $docx = Join-Path $env:RUNNER_TEMP 'rapport.docx'
          $pdf = Join-Path $env:RUNNER_TEMP 'rapport.pdf'
          $lines += @(
            (@{ jsonrpc = '2.0'; id = 8; method = 'power.save'; params = @{ request = @{ design = 't_two'; mode = 'sample_size'; effects = @(@{ d = 0.5 }) } } } | ConvertTo-Json -Compress -Depth 6),
            (@{ jsonrpc = '2.0'; id = 6; method = 'report.export'; params = @{ path = $docx; format = 'docx'; options = @{ analyses = @(1) } } } | ConvertTo-Json -Compress -Depth 5),
            (@{ jsonrpc = '2.0'; id = 7; method = 'report.export'; params = @{ path = $pdf; format = 'pdf'; options = @{ analyses = @(1) } } } | ConvertTo-Json -Compress -Depth 5)
          )
          Remove-Item $proj -ErrorAction SilentlyContinue
          $out = ($lines -join "`n") | & $exe.FullName
          Write-Output $out
          foreach ($f in @($docx, $pdf)) {
            if (-not (Test-Path $f) -or (Get-Item $f).Length -lt 20000) { throw "Rapport non produit : $f" }
          }
          # Calcul de puissance (scipy, loi de Student non centrale) : 64 par groupe pour d = 0,5.
          if (-not ($out -match '"n1": 64')) { throw "Le moteur autonome ne calcule pas la taille d'échantillon" }
          $head = [IO.File]::ReadAllBytes($pdf)[0..4]
          if ([Text.Encoding]::ASCII.GetString($head) -ne '%PDF-') { throw "Le rapport PDF est invalide" }

      - name: Construire l'application et les installateurs (0.1.0, puis 0.1.1 pour le test de mise à jour)
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP/maj | Out-Null
          npx tauri build --bundles nsis --config ../../packaging/test-mise-a-jour.json
          Move-Item src-tauri/target/release/bundle/nsis/STATPFE_0.1.1_*-setup.exe $env:RUNNER_TEMP/maj/

      - name: Installer, lancer, mettre à jour et désinstaller
        shell: pwsh
        env:
          STATPFE_CONFIG_DIR: ${{ runner.temp }}\statpfe-config
        run: |
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/STATPFE_0.1.0_*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'STATPFE'
          Get-ChildItem $dir
          foreach ($f in @('statpfe.exe', 'statpfe-engine.exe')) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f absent après installation" }
          }
          $engine = Join-Path $dir 'statpfe-engine.exe'
          $out = '{"jsonrpc":"2.0","id":1,"method":"engine.selfcheck"}' | & $engine
          Write-Output $out
          if (-not ($out -match '"ok": true, "checks"')) { throw "Une dépendance incluse ne fonctionne pas" }
          # Parcours réel avec le moteur installé : projet, données, analyse, rapports.
          $work = Join-Path $env:RUNNER_TEMP 'travail'
          python packaging/engine_functional.py $engine $work create
          if ($LASTEXITCODE -ne 0) { throw "Parcours du moteur installé en échec" }

          # Lancement réel de l'application : la fenêtre s'ouvre et démarre le moteur.
          $app = Start-Process -FilePath (Join-Path $dir 'statpfe.exe') -PassThru
          $started = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if (Get-Process -Name 'statpfe-engine' -ErrorAction SilentlyContinue) { $started = $true; break }
            if ($app.HasExited) { throw "L'application s'est arrêtée au démarrage (code $($app.ExitCode))" }
          }
          if (-not $started) { throw "L'application n'a pas démarré le moteur" }
          Write-Output "Application lancée, moteur démarré après $i s"
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'captures') | Out-Null
          $bmp.Save((Join-Path $env:RUNNER_TEMP 'captures/windows-application.png'))
          Stop-Process -Id $app.Id
          for ($i = 0; $i -lt 20 -and (Get-Process -Name 'statpfe-engine' -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 1 }
          if (Get-Process -Name 'statpfe-engine' -ErrorAction SilentlyContinue) { throw "Le moteur est resté actif après la fermeture" }

          # Mise à jour 0.1.0 -> 0.1.1 par-dessus l'installation : le projet et les réglages restent.
          $upd = Get-ChildItem $env:RUNNER_TEMP/maj/STATPFE_0.1.1_*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $upd.FullName -ArgumentList '/S' -Wait
          $ver = (Get-Item (Join-Path $dir 'statpfe.exe')).VersionInfo.ProductVersion
          Write-Output "Version installée après mise à jour : $ver"
          if (-not $ver.StartsWith('0.1.1')) { throw "La mise à jour n'a pas remplacé l'application ($ver)" }
          python packaging/engine_functional.py $engine $work reopen
          if ($LASTEXITCODE -ne 0) { throw "Projet perdu ou illisible après la mise à jour" }

          # Désinstallation : l'application part, les projets et réglages de l'utilisateur restent.
          Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir 'statpfe.exe')) { throw "La désinstallation a laissé l'application" }
          if (-not (Test-Path (Join-Path $work 'etude.statpfe'))) { throw "La désinstallation a supprimé un projet" }
          if (-not (Test-Path (Join-Path $env:STATPFE_CONFIG_DIR 'recent-projects.json'))) { throw "Réglages supprimés" }
          Write-Output "Installation, lancement, mise à jour et désinstallation vérifiés ; projets conservés."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-windows
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: statpfe-windows-installateurs
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  linux-packages:
    name: Paquets Linux (.deb, .rpm, AppImage)
    needs: [engine, frontend]
    # Ubuntu 22.04 : glibc plus ancienne, donc paquets compatibles avec plus de distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Dépendances système de construction et d'essai
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb imagemagick
      - name: Construire le moteur autonome (PyInstaller)
        working-directory: engine
        run: |
          pip install pyinstaller
          pip install -e .
          python packaging/build_sidecar.py
      - name: Construire les paquets (0.1.0, puis .deb 0.1.1 pour le test de mise à jour)
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles deb,rpm,appimage
          mkdir -p "$RUNNER_TEMP/maj"
          npx tauri build --bundles deb --config ../../packaging/test-mise-a-jour.json
          mv src-tauri/target/release/bundle/deb/STATPFE_0.1.1_amd64.deb "$RUNNER_TEMP/maj/"
      - name: "Paquet .deb : installer, lancer, mettre à jour, désinstaller"
        env:
          STATPFE_CONFIG_DIR: ${{ runner.temp }}/statpfe-config
        run: |
          B=apps/desktop/src-tauri/target/release/bundle
          mkdir -p "$RUNNER_TEMP/captures"
          sudo apt-get install -y "./$B/deb/STATPFE_0.1.0_amd64.deb"
          python packaging/engine_functional.py /usr/bin/statpfe-engine "$RUNNER_TEMP/travail" create
          packaging/linux-smoke.sh statpfe /usr/bin/statpfe-engine "$RUNNER_TEMP/captures/linux-deb.png"
          sudo apt-get install -y "$RUNNER_TEMP/maj/STATPFE_0.1.1_amd64.deb"
          test "$(dpkg-query -W -f='${Version}' statpfe)" = "0.1.1"
          python packaging/engine_functional.py /usr/bin/statpfe-engine "$RUNNER_TEMP/travail" reopen
          sudo apt-get remove -y statpfe
          test ! -e /usr/bin/statpfe && test ! -e /usr/bin/statpfe-engine
          test -f "$RUNNER_TEMP/travail/etude.statpfe" && test -f "$STATPFE_CONFIG_DIR/recent-projects.json"
          echo "Paquet .deb : installation, lancement, mise à jour et désinstallation vérifiés ; projets conservés."
      - name: "AppImage : lancer sans installation"
        run: |
          B=apps/desktop/src-tauri/target/release/bundle/appimage
          chmod +x $B/*.AppImage
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/$B/*.AppImage --appimage-extract >/dev/null && cd -
          APPIMAGE_EXTRACT_AND_RUN=1 packaging/linux-smoke.sh "$(ls $B/*.AppImage)" "$RUNNER_TEMP/squashfs-root/usr/bin/statpfe-engine" "$RUNNER_TEMP/captures/linux-appimage.png"
      - name: "Paquet .rpm : installer et utiliser sous Fedora (conteneur)"
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src fedora:41 bash -c '
            set -e
            dnf install -y -q python3 ./apps/desktop/src-tauri/target/release/bundle/rpm/STATPFE-0.1.0-1.x86_64.rpm
            test -x /usr/bin/statpfe && test -x /usr/bin/statpfe-engine
            printf "%s\n" "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"engine.selfcheck\"}" | /usr/bin/statpfe-engine | grep -q "\"ok\": true, \"checks\""
            python3 packaging/engine_functional.py /usr/bin/statpfe-engine /tmp/travail create
            dnf remove -y -q statpfe
            test ! -e /usr/bin/statpfe
            echo "Paquet .rpm : installation, moteur, parcours et désinstallation vérifiés sous Fedora 41."'
      - uses: actions/upload-artifact@v4
        with:
          name: statpfe-linux-paquets
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-linux
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore

  macos-package:
    name: Paquet macOS (.dmg, Apple Silicon)
    needs: [engine, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Construire le moteur autonome (PyInstaller)
        working-directory: engine
        run: |
          pip install pyinstaller
          pip install -e .
          python packaging/build_sidecar.py
      - name: Construire l'application et le .dmg
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --bundles app,dmg
      - name: Installer depuis le .dmg, lancer, désinstaller
        env:
          STATPFE_CONFIG_DIR: ${{ runner.temp }}/statpfe-config
        run: |
          DMG=$(ls apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse
          mkdir -p "$HOME/Applications"
          cp -R "$MNT/STATPFE.app" "$HOME/Applications/"
          hdiutil detach "$MNT"
          APPDIR="$HOME/Applications/STATPFE.app"
          ENGINE="$APPDIR/Contents/MacOS/statpfe-engine"
          codesign --verify --verbose "$APPDIR" || true
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"engine.selfcheck"}' | "$ENGINE" | tee /dev/stderr | grep -q '"ok": true, "checks"'
          python packaging/engine_functional.py "$ENGINE" "$RUNNER_TEMP/travail" create
          python packaging/engine_functional.py "$ENGINE" "$RUNNER_TEMP/travail" reopen
          open "$APPDIR"
          for i in $(seq 1 60); do pgrep -x statpfe-engine >/dev/null && break; sleep 1; done
          pgrep -x statpfe-engine >/dev/null || { echo "L'application n'a pas démarré le moteur"; exit 1; }
          echo "Application lancée, moteur démarré après $i s"
          sleep 8
          mkdir -p "$RUNNER_TEMP/captures"
          screencapture -x "$RUNNER_TEMP/captures/macos-application.png" || echo "capture d'écran indisponible"
          osascript -e 'quit app "STATPFE"' || pkill -x statpfe
          for i in $(seq 1 20); do pgrep -x statpfe-engine >/dev/null || break; sleep 1; done
          pgrep -x statpfe-engine >/dev/null && { echo "Le moteur est resté actif après la fermeture"; exit 1; }
          rm -rf "$APPDIR"
          test -f "$RUNNER_TEMP/travail/etude.statpfe"
          echo "macOS : installation depuis le .dmg, lancement, fermeture et désinstallation vérifiés."
      - uses: actions/upload-artifact@v4
        with:
          name: statpfe-macos-dmg
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-macos
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
