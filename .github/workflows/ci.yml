name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Moteur Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "engine[dev]"
      - run: python -m pytest -q
        working-directory: engine

  r-validation:
    name: Validation des statistiques contre R
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer R (paquets de base et pwr)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q r-base-core r-cran-pwr
          Rscript -e 'cat(R.version.string, "\n")'
      - run: pip install -e "engine[dev]"
      - name: Recalculer les valeurs de référence avec R
        working-directory: engine
        run: Rscript tests/reference/r_reference.R tests/reference/data "$RUNNER_TEMP/r_results.csv"
      - name: Comparer le moteur aux valeurs de R recalculées
        working-directory: engine
        env:
          STATPFE_R_RESULTS: ${{ runner.temp }}/r_results.csv
        run: python -m pytest -q tests/test_reference_r.py
      - name: Recalculer les valeurs de puissance avec R (pwr, power.t.test)
        working-directory: engine
        run: Rscript tests/reference/r_power.R "$RUNNER_TEMP/r_power.csv"
      - name: Comparer les calculs de puissance aux valeurs de R
        working-directory: engine
        env:
          STATPFE_R_POWER: ${{ runner.temp }}/r_power.csv
        run: python -m pytest -q tests/test_power_r.py

  local-ai:
    name: IA locale avec un vrai modèle (Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "engine[dev]"
      - name: Installer Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Selon le runner, le service n'est pas démarré (pas de systemd) : le test suivant le
          # démarre alors par le bouton « Démarrer Ollama » de STATPFE.
      - name: Télécharger le modèle par l'assistant de STATPFE (qwen2.5:0.5b)
        working-directory: engine
        env:
          STATPFE_AI_LIVE_URL: http://127.0.0.1:11434
          STATPFE_SETUP_LIVE_PULL: qwen2.5:0.5b
        run: |
          python -m pytest -q -rs -s tests/test_ai_setup_live.py -k ollama
          ollama list
      - name: Parcours complet avec le modèle (protocoles Ollama et OpenAI)
        working-directory: engine
        env:
          STATPFE_AI_LIVE_URL: http://127.0.0.1:11434
          STATPFE_AI_LIVE_MODEL: qwen2.5:0.5b
          STATPFE_AI_LIVE_OUT: ${{ runner.temp }}/textes-ia.jsonl
        run: |
          python -m pytest -q -rs tests/test_ai_live.py
          cat "$RUNNER_TEMP/textes-ia.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: textes-produits-par-le-modele
          path: ${{ runner.temp }}/textes-ia.jsonl

  claude-code-install:
    name: Installation de Claude Code par l'assistant (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "engine[dev]"
      - name: Installation réelle par la commande officielle, puis détection
        working-directory: engine
        env:
          STATPFE_SETUP_LIVE_CLAUDE: "1"
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -rs -s tests/test_ai_setup_live.py -k claude

  frontend:
    name: Interface React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  windows-installer:
    name: Installateur Windows
    needs: [engine, r-validation, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Construire le moteur autonome (PyInstaller)
        working-directory: engine
        run: |
          pip install pyinstaller
          pip install -e .
          python packaging/build_sidecar.py

      - name: Vérifier le moteur autonome
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/src-tauri/binaries/statpfe-engine-*.exe | Select-Object -First 1
          $out = '{"jsonrpc":"2.0","id":1,"method":"engine.info"}' | & $exe.FullName
          Write-Output $out
          if (-not ($out -match '"name": "statpfe-engine"')) { throw "Le moteur autonome ne répond pas" }
          # IA locale : désactivée par défaut, ressources de la machine lues (mémoire Windows).
          $out = '{"jsonrpc":"2.0","id":9,"method":"ai.status"}' | & $exe.FullName
          Write-Output $out
          if (-not ($out -match '"state": "desactivee"') -or ($out -match '"memory_total": null')) { throw "Le module IA du moteur autonome est défaillant" }
          # Lecture réelle d'un CSV (pandas embarqué) par le moteur autonome.
          $csv = Join-Path $env:RUNNER_TEMP 'essai.csv'
          [IO.File]::WriteAllText($csv, "groupe;note`nA;12,5`nB;9`n", [Text.Encoding]::GetEncoding(1252))
          $req = @{ jsonrpc = '2.0'; id = 2; method = 'data.inspect_file'; params = @{ path = $csv } } | ConvertTo-Json -Compress
          $out = $req | & $exe.FullName
          Write-Output $out
          if (-not ($out -match '"rows": 2')) { throw "Le moteur autonome ne lit pas les fichiers CSV" }
          # Analyse statistique réelle (scipy embarqué) : projet, import, test de Welch.
          [IO.File]::WriteAllText($csv, "g;note`nA;12,5`nA;13`nA;11,5`nB;9`nB;10`nB;8,5`n", [Text.Encoding]::GetEncoding(1252))
          $proj = Join-Path $env:RUNNER_TEMP 'essai.statpfe'
          $lines = @(
            (@{ jsonrpc = '2.0'; id = 3; method = 'project.create'; params = @{ path = $proj; study = @{ title = 'Essai' } } } | ConvertTo-Json -Compress -Depth 5),
            (@{ jsonrpc = '2.0'; id = 4; method = 'data.import'; params = @{ path = $csv; name = 'E' } } | ConvertTo-Json -Compress -Depth 5),
            (@{ jsonrpc = '2.0'; id = 5; method = 'analysis.run'; params = @{ dataset_id = 1; method = 'welch'; params = @{ outcome = 'note'; group = 'g' } } } | ConvertTo-Json -Compress -Depth 5)
          )
          $out = ($lines -join "`n") | & $exe.FullName
          Write-Output $out
          if (-not ($out -match '"key": "t", "label": "t", "value": 5\.07796')) { throw "Le moteur autonome ne calcule pas le test de Welch" }
          # Rapports réels (python-docx, reportlab, matplotlib embarqués) : Word et PDF.
          $docx = Join-Path $env:RUNNER_TEMP 'rapport.docx'
          $pdf = Join-Path $env:RUNNER_TEMP 'rapport.pdf'
          $lines += @(
            (@{ jsonrpc = '2.0'; id = 8; method = 'power.save'; params = @{ request = @{ design = 't_two'; mode = 'sample_size'; effects = @(@{ d = 0.5 }) } } } | ConvertTo-Json -Compress -Depth 6),
            (@{ jsonrpc = '2.0'; id = 6; method = 'report.export'; params = @{ path = $docx; format = 'docx'; options = @{ analyses = @(1) } } } | ConvertTo-Json -Compress -Depth 5),
            (@{ jsonrpc = '2.0'; id = 7; method = 'report.export'; params = @{ path = $pdf; format = 'pdf'; options = @{ analyses = @(1) } } } | ConvertTo-Json -Compress -Depth 5)
          )
          Remove-Item $proj -ErrorAction SilentlyContinue
          $out = ($lines -join "`n") | & $exe.FullName
          Write-Output $out
          foreach ($f in @($docx, $pdf)) {
            if (-not (Test-Path $f) -or (Get-Item $f).Length -lt 20000) { throw "Rapport non produit : $f" }
          }
          # Calcul de puissance (scipy, loi de Student non centrale) : 64 par groupe pour d = 0,5.
          if (-not ($out -match '"n1": 64')) { throw "Le moteur autonome ne calcule pas la taille d'échantillon" }
          $head = [IO.File]::ReadAllBytes($pdf)[0..4]
          if ([Text.Encoding]::ASCII.GetString($head) -ne '%PDF-') { throw "Le rapport PDF est invalide" }

      - name: Construire l'application et les installateurs
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build

      - name: Installer silencieusement et vérifier
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'STATPFE'
          Get-ChildItem $dir
          foreach ($f in @('statpfe.exe', 'statpfe-engine.exe')) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f absent après installation" }
          }
          $out = '{"jsonrpc":"2.0","id":1,"method":"engine.info"}' | & (Join-Path $dir 'statpfe-engine.exe')
          if (-not ($out -match '"name": "statpfe-engine"')) { throw "Le moteur installé ne répond pas" }
          $uninstall = Join-Path $dir 'uninstall.exe'
          Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir 'statpfe.exe')) { throw "La désinstallation a laissé l'application" }
          Write-Output "Installation et désinstallation vérifiées."

      - uses: actions/upload-artifact@v4
        with:
          name: statpfe-windows-installateurs
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
